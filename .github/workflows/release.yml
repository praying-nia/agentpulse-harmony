name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish HarmonyOS release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect Hvigor project
        id: project
        shell: bash
        run: |
          if [[ -f hvigorw ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build HarmonyOS release
        if: steps.project.outputs.exists == 'true'
        shell: bash
        run: |
          chmod +x hvigorw
          ./hvigorw --no-daemon assembleHap

      - name: Package source
        shell: bash
        run: |
          mkdir -p dist
          repository="${GITHUB_REPOSITORY#*/}"
          archive="dist/${repository}-${GITHUB_REF_NAME}-source.tar.gz"
          tar --exclude='.git' --exclude='.git/*' --exclude='./dist' --exclude='*/build' --exclude=target -czf "$archive" .
          shasum -a 256 "$archive" > "${archive}.sha256"

      - name: Collect HarmonyOS outputs
        if: steps.project.outputs.exists == 'true'
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            cp "$file" dist/
          done < <(find . -type f -name '*.hap' -print0)

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
